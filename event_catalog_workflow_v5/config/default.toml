[project]
year_min = 2016
# "present" = through the current UTC date (the reconciled catalog extends to today).
year_max = "present"

[paths]
raw_catalog = "data/raw/merged_launches.csv"
canonical_catalog = "data/processed/launch_catalog.csv"
database = "data/processed/ksc_rockets.sqlite"
event_overrides = "data/curated/event_overrides.csv"
event_id_registry = "data/curated/event_id_registry.csv"
metrics_index = "data/raw/launch_metrics_index.csv"
website_output = "outputs/website"
analysis_output = "outputs/ensemble"
launchpads = "data/raw/launchpads.csv"
# Event waveform files and their extraction manifests are external to Git.
event_waveforms = "/Volumes/tachyon/KSC_EVENTS"

[products]
# Per-event products (miniSEED, plots, manifests) are written outside Git, to
# <out_root>/<YYYY>/<event_id>/; the small result tables go to data/products/ (in Git).
out_root = "~/work/KSC_event_catalog"   # ~/work -> /Volumes/Pulwtop (NVMe); classdata is read-only
# ksclib ensemble file: network eras, archives, responses and pads (relative to this repo's parent)
ensemble = "../07_ensemble_paper/ensemble.yaml"

[catalog]
dedupe_tolerance_seconds = 120

[website]
title = "KSC Rocket Seismology Event Catalog"
subtitle = "Kennedy Space Center / Cape Canaveral seismo-acoustic launch catalog"
